<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo de Abonados</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eff0fa;--card:#fff;--tx:#0f1030;--mu:#5b5f80;--ac:#0000b8;--ac2:#e8e9fb;--bd:#dcdef2;--rd:#e61e1e}
@media(prefers-color-scheme:dark){:root{--bg:#07071f;--card:#0f1034;--tx:#f1f2ff;--mu:#a3a6d0;--ac:#3b3bf0;--ac2:#1a1b55;--bd:#26286a;--rd:#ff4545}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:520px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(0,0,184,.10);border-top:5px solid var(--rd)}
.logo{display:block;width:132px;height:132px;margin:0 auto 14px;border-radius:16px}
h1,p.sub{text-align:center}
h1{font-size:1.5rem;margin:0 0 4px;font-weight:700}
p.sub{margin:0 0 24px;color:var(--mu);font-size:.95rem}
.drop{display:block;border:2px dashed var(--bd);border-radius:14px;padding:22px;text-align:center;cursor:pointer;color:var(--mu);transition:.2s}
.drop:hover,.drop.ok{border-color:var(--ac);color:var(--tx);background:var(--ac2)}
.drop input{display:none}
.lbl{display:block;margin:22px 0 10px;font-size:.85rem;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.txt{width:100%;padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font-size:1rem;font-family:inherit}
.txt:focus{outline:2px solid var(--ac);border-color:transparent}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button{padding:12px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:12px;font-size:1.1rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
.go:disabled{opacity:.4;cursor:not-allowed}
.msg{margin-top:12px;font-size:.88rem;color:var(--mu);min-height:1.2em}
.msg.err{color:#dc2626}
#win{display:none}
.spin{font-size:1.4rem;font-weight:700;text-align:center;padding:40px 0;color:var(--ac)}
.w{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--bd);border-radius:14px;margin-top:12px;background:var(--ac2);animation:in .5s both}
.w .n{flex:none;width:38px;height:38px;border-radius:50%;background:var(--rd);color:#fff;display:grid;place-items:center;font-weight:700}
.w b{display:block;font-size:1.15rem;line-height:1.25}
.w small{color:var(--mu)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.rw{flex:1;min-width:0}
.win{height:68px;overflow:hidden;position:relative}
.w:not(.done) .win{-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.it{height:68px;display:flex;align-items:center;font-size:1.1rem;font-weight:700;line-height:1.25}
.it span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.w.run .strip{filter:blur(1.5px)}
.w.done .win{color:var(--ac)}
.w.done{animation:pop .45s}
@keyframes pop{50%{transform:scale(1.04)}}
.go:disabled,.link:disabled{opacity:.4;cursor:not-allowed}
.foot{margin:30px 0 0;text-align:center;font-size:.62rem;color:var(--mu);opacity:.35;letter-spacing:.02em}
.link{background:none;border:0;color:var(--ac);font-size:.95rem;font-weight:600;cursor:pointer;margin-top:20px;padding:0}
</style>
</head>

  <h1 id="wt">🎉 Ganadores</h1>
  <div id="list"></div>
  <button class="go" id="again">Sortear de nuevo</button>
  <button class="link" id="back">← Cargar otro archivo</button>
</section>
<p class="foot">© 2026 Leonel Cardoza for Tvcable com. All rights reserved.</p>
</main>
<script>
const $=id=>document.getElementById(id);
let pool=[],qty=1;
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/gi,"").toLowerCase();
const clean=s=>String(s==null?"":s).trim().replace(/\s+/g," ").toLocaleUpperCase("es");
const rnd=n=>{const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;do crypto.getRandomValues(a);while(a[0]>=lim);return a[0]%n};
[1,2].forEach(n=>{const b=document.createElement("button");b.textContent=n;b.className=n===1?"on":"";b.onclick=()=>{qty=n;[...$("seg").children].forEach(c=>c.classList.toggle("on",c===b))};$("seg").appendChild(b)});
function say(t,e){$("msg").textContent=t;$("msg").className="msg"+(e?" err":"")}
$("file").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;pool=[];$("go").disabled=true;
  if(!/\.xlsx$/i.test(f.name)){say("El archivo debe ser .xlsx",1);return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
    if(!rows.length)throw Error("El archivo está vacío");
    const keys=Object.keys(rows[0]),find=k=>keys.find(x=>norm(x)===k);
    const kA=find("nabonado"),kN=find("nombre"),kP=find("apellido");
    if(!kA||!kN)throw Error("Faltan las columnas «N° Abonado» y «Nombre»");
    const seen=new Map();
    rows.forEach(r=>{const id=clean(r[kA]);if(id&&!seen.has(id))seen.set(id,{id,nombre:clean(r[kN]),apellido:kP?clean(r[kP]):""})});
    pool=[...seen.values()];
    if(!pool.length)throw Error("No hay abonados válidos");
    $("fname").textContent="✓ "+f.name;$("drop").classList.add("ok");
    say(pool.length.toLocaleString("es")+" abonados únicos listos para el sorteo");$("go").disabled=false;
  }catch(err){$("drop").classList.remove("ok");$("fname").textContent="Toca para cargar un archivo .xlsx";say(err.message,1)}
};
function draw(){
  const q=Math.min(qty,pool.length),a=pool.slice(),w=[];
  for(let i=0;i<q;i++){const j=i+rnd(a.length-i);[a[i],a[j]]=[a[j],a[i]];w.push(a[i])}
  $("setup").style.display="none";$("win").style.display="block";
  const c=$("cab").value.trim();$("wt").textContent="🎉 Ganadores"+(c?" de la cabecera "+c:"");
  const L=$("list");L.innerHTML="";$("again").disabled=$("back").disabled=true;
  let left=w.length;
  w.forEach((p,i)=>{
    const dur=9000+i*3500,names=[];
    for(let k=0,n=Math.round(dur/1000*18);k<n;k++){const r=pool[rnd(pool.length)];names.push((r.nombre+" "+r.apellido).trim())}
    names.push((p.nombre+" "+p.apellido).trim());
    const e=document.createElement("div");e.className="w run";
    e.innerHTML='<div class="n">'+(i+1)+'</div><div class="rw"><div class="win"><div class="strip"></div></div><small>&nbsp;</small></div>';
    const st=e.querySelector(".strip");
    names.forEach(t=>{const d=document.createElement("div");d.className="it";const sp=document.createElement("span");sp.textContent=t;d.appendChild(sp);st.appendChild(d)});
    L.appendChild(e);
    const h=st.firstChild.offsetHeight;
    st.getBoundingClientRect();
    st.style.transition="transform "+dur+"ms cubic-bezier(.17,.67,.2,1)";
    st.style.transform="translateY(-"+(names.length-1)*h+"px)";
    setTimeout(()=>e.classList.remove("run"),dur*.5);
    setTimeout(()=>{e.classList.add("done");e.querySelector("small").textContent="N° Abonado: "+p.id;
      if(--left===0)$("again").disabled=$("back").disabled=false},dur+60);
  });
}
$("go").onclick=draw;$("again").onclick=draw;
$("back").onclick=()=>{$("win").style.display="none";$("setup").style.display="block"};
</script>
